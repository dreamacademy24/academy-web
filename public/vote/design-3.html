<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>예시 3 — 갤러리 + 노션 스타일</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Pretendard','Apple SD Gothic Neo',sans-serif}
body{background:#fafafa;color:#1f2937;padding:24px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto}
.h{font-size:22px;font-weight:800;margin-bottom:6px}
.sub{font-size:13px;color:#6b7280;margin-bottom:20px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tile{background:#fff;border-radius:10px;overflow:hidden;border:1px solid #e5e7eb;cursor:pointer;transition:all .12s}
.tile:hover{box-shadow:0 6px 16px rgba(0,0,0,0.07)}
.cover{height:120px;display:flex;align-items:center;justify-content:center;font-size:38px}
.body{padding:12px}
.t-title{font-size:14px;font-weight:700;margin-bottom:4px}
.t-meta{font-size:11px;color:#6b7280;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:10px;padding:2px 7px;border-radius:6px;background:#f3f4f6;color:#4b5563;font-weight:600}
.bar{height:4px;background:#e5e7eb;border-radius:2px;margin-top:8px;overflow:hidden}
.fill{height:100%;background:#534AB7}
</style>
</head>
<body>
<div class="wrap">
  <div class="h">🖼️ 프로젝트 — 갤러리 (노션 스타일)</div>
  <div class="sub">큰 커버 이미지 + 메타데이터 칩. 노션 갤러리 뷰처럼 시각적으로 풍부.</div>
  <div class="gal">
    <div class="tile">
      <div class="cover" style="background:linear-gradient(135deg,#a78bfa,#7c3aed)">🚀</div>
      <div class="body">
        <div class="t-title">웹사이트 리뉴얼</div>
        <div class="t-meta"><span class="chip">진행중</span><span>📋 12</span><span>💬 5</span><span>D-12</span></div>
        <div class="bar"><div class="fill" style="width:78%"></div></div>
      </div>
    </div>
    <div class="tile">
      <div class="cover" style="background:linear-gradient(135deg,#fbbf24,#f59e0b)">📣</div>
      <div class="body">
        <div class="t-title">신규 학생 모집 캠페인</div>
        <div class="t-meta"><span class="chip">대기중</span><span>📋 8</span><span>💬 12</span><span>D-23</span></div>
        <div class="bar"><div class="fill" style="width:45%;background:#f59e0b"></div></div>
      </div>
    </div>
    <div class="tile">
      <div class="cover" style="background:linear-gradient(135deg,#60a5fa,#2563eb)">🏠</div>
      <div class="body">
        <div class="t-title">하우스 시설 점검</div>
        <div class="t-meta"><span class="chip">계획중</span><span>📋 4</span><span>D-45</span></div>
        <div class="bar"><div class="fill" style="width:15%;background:#3b82f6"></div></div>
      </div>
    </div>
    <div class="tile">
      <div class="cover" style="background:linear-gradient(135deg,#34d399,#059669)">📚</div>
      <div class="body">
        <div class="t-title">교재 개정판</div>
        <div class="t-meta"><span class="chip">완료</span><span>📋 22</span><span>💬 18</span></div>
        <div class="bar"><div class="fill" style="width:100%;background:#10b981"></div></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
