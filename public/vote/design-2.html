<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>예시 2 — 카드 + 담당자</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Pretendard','Apple SD Gothic Neo',sans-serif}
body{background:#f6f7fb;color:#1f2937;padding:24px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto}
.h{font-size:22px;font-weight:800;margin-bottom:6px}
.sub{font-size:13px;color:#6b7280;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:all .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,0.08)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:9px}
.title{font-size:15px;font-weight:800}
.desc{font-size:12px;color:#6b7280;flex:1}
.foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #f3f4f6;padding-top:10px}
.avs{display:flex;gap:-6px}
.av{width:26px;height:26px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;border:2px solid #fff;margin-left:-6px}
.av:first-child{margin-left:0}
.bar{height:5px;background:#e5e7eb;border-radius:3px;overflow:hidden}
.fill{height:100%;background:#534AB7;border-radius:3px}
</style>
</head>
<body>
<div class="wrap">
  <div class="h">🃏 프로젝트 — 카드 + 담당자</div>
  <div class="sub">한눈에 들어오는 카드 그리드. 각 카드에 담당자 아바타 + 진행률</div>
  <div class="grid">
    <div class="card">
      <div><span class="tag" style="background:#dcfce7;color:#166534">진행중</span></div>
      <div class="title">웹사이트 리뉴얼</div>
      <div class="desc">메인/예약/관리자 페이지 전반 개편. 신규 디자인 시스템 적용.</div>
      <div class="bar"><div class="fill" style="width:78%"></div></div>
      <div style="font-size:11px;color:#534AB7;font-weight:700">78% · D-12</div>
      <div class="foot">
        <div class="avs"><div class="av" style="background:#3b82f6">M</div><div class="av" style="background:#10b981">J</div><div class="av" style="background:#f59e0b">+2</div></div>
        <div style="font-size:11px;color:#9ca3af">📋 12 · 💬 5</div>
      </div>
    </div>
    <div class="card">
      <div><span class="tag" style="background:#fef3c7;color:#92400e">대기중</span></div>
      <div class="title">신규 학생 모집 캠페인</div>
      <div class="desc">3월 신규 학생 30명 모집 목표. 광고/SNS/입학설명회 진행.</div>
      <div class="bar"><div class="fill" style="width:45%;background:#f59e0b"></div></div>
      <div style="font-size:11px;color:#f59e0b;font-weight:700">45% · D-23</div>
      <div class="foot">
        <div class="avs"><div class="av" style="background:#ef4444">C</div></div>
        <div style="font-size:11px;color:#9ca3af">📋 8 · 💬 12</div>
      </div>
    </div>
    <div class="card">
      <div><span class="tag" style="background:#dbeafe;color:#1e40af">계획중</span></div>
      <div class="title">하우스 시설 점검</div>
      <div class="desc">분기별 시설 안전점검. 호실별 체크리스트 + 보고서.</div>
      <div class="bar"><div class="fill" style="width:15%;background:#3b82f6"></div></div>
      <div style="font-size:11px;color:#3b82f6;font-weight:700">15% · D-45</div>
      <div class="foot">
        <div class="avs"><div class="av" style="background:#8b5cf6">S</div><div class="av" style="background:#ec4899">A</div></div>
        <div style="font-size:11px;color:#9ca3af">📋 4 · 💬 0</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
