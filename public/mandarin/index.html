<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>jia & jiu has moved</title><style>body{font:18px/1.7 system-ui,sans-serif;max-width:620px;margin:12vh auto;padding:25px;color:#234e43;background:#f7f7ef}a{display:inline-block;padding:15px 22px;border-radius:18px;background:#236758;color:white;text-decoration:none}</style><h1>jia & jiu has a new home.</h1><p>The Mandarin learning app is now a completely separate app. Please remove the old home-screen shortcut and install it from the new address.</p><a href="https://jia-jiu-mandarin.vercel.app/">Open jia & jiu</a><script>if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.filter(r=>r.scope===location.origin+'/mandarin/').map(r=>r.unregister())));if('caches'in window)caches.keys().then(ks=>Promise.all(ks.filter(k=>k.startsWith('jia-jiwoo-mandarin-')).map(k=>caches.delete(k))));</script></html>
