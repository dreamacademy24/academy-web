<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>자주 묻는 질문 | 다온맘 × 드림아카데미</title>
<meta property="og:title" content="자주 묻는 질문 | 다온맘 × 드림아카데미" />
<meta property="og:description" content="세부 영어캠프 공구 — 궁금한 점을 검색해 보세요" />
<meta property="og:image" content="https://www.dreamacademyph.com/daonmam/og.png" />
<meta name="robots" content="noindex">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:linear-gradient(160deg,#faf6ef,#f3ead9);min-height:100vh;color:#26303f}
.wrap{max-width:760px;margin:0 auto;padding:34px 18px 70px}
.chip0{display:inline-block;background:#1f2937;color:#fff;font-size:12.5px;font-weight:700;padding:6px 14px;border-radius:999px;margin-bottom:14px}
h1{font-size:27px;font-weight:900;letter-spacing:-.5px}
h1 .q{color:#c9962e}
.sub{margin-top:8px;font-size:14px;color:#8a7c5e;line-height:1.6}
.search{position:relative;margin:22px 0 4px}
.search input{width:100%;padding:14px 18px;border:2px solid #e8dfc9;border-radius:24px;font-size:15px;outline:none;font-family:inherit;background:#fff}
.search input:focus{border-color:#c9962e}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 4px}
.chip{border:1.5px solid #e8dfc9;background:#fff;color:#6b5b3e;font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:18px;cursor:pointer;font-family:inherit}
.chip.on{background:#1f2937;border-color:#1f2937;color:#fff}
.cnt{font-size:12px;color:#a89a78;margin:10px 2px 14px}
.fqi{background:#fff;border:1px solid #eee4cf;border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:0 1px 3px rgba(120,100,50,.05)}
.fqq{width:100%;border:none;background:none;display:flex;align-items:center;gap:10px;padding:15px 16px;cursor:pointer;text-align:left;font-family:inherit}
.fqcat{flex-shrink:0;font-size:11px;font-weight:700;color:#8a6414;background:#f7efdc;padding:3px 9px;border-radius:8px;white-space:nowrap}
.fqtx{flex:1;font-size:15px;font-weight:700;color:#26303f;line-height:1.45}
.arw{flex-shrink:0;font-size:18px;color:#cdbf9d;transition:transform .15s}
.fqi.op .arw{transform:rotate(45deg);color:#c9962e}
.fqa{display:none;padding:2px 20px 18px 20px;font-size:14px;line-height:1.75;color:#4a5468;border-top:1px dashed #f0e6cf;margin:0 0;padding-top:12px}
.fqi.op .fqa{display:block}
.fqa b,.fqa strong{color:#c0392b;font-weight:700}
.none{text-align:center;color:#a89a78;padding:44px;font-size:14px}
.foot{margin-top:34px;text-align:center;font-size:13px;color:#a89a78;line-height:1.8}
.foot a{color:#8a6414;font-weight:700;text-decoration:none}
@media(max-width:480px){h1{font-size:22px}.fqtx{font-size:14px}}
</style>
</head>
<body>
<div class="wrap">
<span class="chip0">다온맘 × 드림아카데미 · 세부 영어캠프 공구</span>
<h1><span class="q">?</span> 자주 묻는 질문</h1>
<div class="sub">캠프 생활, 체크인, 수업, 셔틀 등 궁금한 점을 검색해 보세요.<br>더 궁금하신 내용은 채널로 편하게 문의 주세요 :)</div>
<div class="search"><input id="s" placeholder="🔍 궁금한 단어 검색 (예: 체크인, 세탁, 픽업, 잔금)"></div>
<div class="chips" id="chips"></div>
<div class="cnt" id="cnt"></div>
<div id="list"><div class="none">불러오는 중…</div></div>
<div class="foot">다온맘 공구 자세히 보기 → <a href="/daonmam">dreamacademyph.com/daonmam</a></div>
</div>
<script>
var SB='https://yiglafscjvjgkxpycevk.supabase.co';
var K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlpZ2xhZnNjanZqZ2t4cHljZXZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwODgzMjcsImV4cCI6MjA4OTY2NDMyN30.k_HErGsz5oYkILWvUGRaU3x1IXKMQOuO5X312tDcXe4';
var DATA=[],CAT='전체',KW='';
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function clean(h){var d=document.createElement('div');d.innerHTML=String(h||'');d.querySelectorAll('script,style,iframe,object').forEach(function(x){x.remove();});d.querySelectorAll('*').forEach(function(el){for(var i=el.attributes.length-1;i>=0;i--){var a=el.attributes[i];if(/^on/i.test(a.name)||(a.name==='href'&&/^javascript:/i.test(a.value)))el.removeAttribute(a.name);}});return d.innerHTML;}
function cats(){var seen=[],out=[];DATA.forEach(function(r){if(r.cat&&seen.indexOf(r.cat)<0){seen.push(r.cat);out.push(r.cat);}});return out;}
function drawChips(){var el=document.getElementById('chips');var h='<button class="chip'+(CAT==='전체'?' on':'')+'" data-c="전체">전체</button>';cats().forEach(function(c){h+='<button class="chip'+(CAT===c?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>';});el.innerHTML=h;el.querySelectorAll('.chip').forEach(function(b){b.onclick=function(){CAT=b.getAttribute('data-c');drawChips();drawList();};});}
function drawList(){var rows=DATA.filter(function(r){if(CAT!=='전체'&&r.cat!==CAT)return false;if(KW){var t=((r.q||'')+' '+(r.a||'')+' '+(r.cat||'')).toLowerCase();if(t.indexOf(KW)<0)return false;}return true;});
document.getElementById('cnt').textContent=rows.length+'개 질문';
var el=document.getElementById('list');
if(!rows.length){el.innerHTML='<div class="none">검색 결과가 없어요.<br>다른 단어로 검색해 보시거나 채널로 문의 주세요 :)</div>';return;}
el.innerHTML=rows.map(function(r,i){return '<div class="fqi" data-i="'+i+'"><button class="fqq"><span class="fqcat">'+esc(r.cat||'')+'</span><span class="fqtx">'+esc(r.q||'')+'</span><span class="arw">+</span></button><div class="fqa">'+clean(r.a)+'</div></div>';}).join('');
el.querySelectorAll('.fqq').forEach(function(b){b.onclick=function(){b.parentElement.classList.toggle('op');};});}
document.getElementById('s').oninput=function(){KW=this.value.trim().toLowerCase();drawList();};
fetch(SB+'/rest/v1/staff_faq?select=*&order=idx.asc',{headers:{apikey:K,Authorization:'Bearer '+K}}).then(function(r){return r.json();}).then(function(d){DATA=Array.isArray(d)?d:[];drawChips();drawList();}).catch(function(){document.getElementById('list').innerHTML='<div class="none">불러오지 못했어요. 새로고침 해주세요.</div>';});
</script>
</body>
</html>
