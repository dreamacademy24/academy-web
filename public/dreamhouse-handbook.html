<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>드림하우스 한국인 매니저 통합 핸드북</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1f3a5f; --navy-deep:#16293f; --cream:#f7f1e6; --cream-soft:#fbf7ef;
    --gold:#b88a2f; --gold-soft:#e9d9b5; --ink:#2a2a26; --muted:#7a7468;
    --line:#e6ddcb; --good:#2f7d5b; --white:#fff; --shadow:0 6px 24px rgba(31,58,95,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--cream);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;}

  /* header */
  header{background:radial-gradient(120% 140% at 85% -20%, rgba(184,138,47,.22), transparent 55%),linear-gradient(160deg,var(--navy) 0%,var(--navy-deep) 100%);color:var(--cream-soft);padding:42px 22px 30px;position:relative;overflow:hidden;}
  header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--gold-soft),var(--gold));}
  .hw{max-width:920px;margin:0 auto;position:relative;z-index:2;}
  .eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-soft);font-weight:700;margin-bottom:12px;}
  header h1{font-family:'Noto Serif KR',serif;font-weight:700;font-size:clamp(24px,5vw,38px);line-height:1.25;letter-spacing:-.01em;}
  header p.lede{margin-top:14px;max-width:680px;color:#d8e0ea;font-size:14.5px;}

  /* tabs */
  nav.tabs{position:sticky;top:0;z-index:50;background:var(--cream-soft);border-bottom:1px solid var(--line);box-shadow:0 2px 12px rgba(31,58,95,.05);}
  .tabs-inner{max-width:920px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:8px 14px;scrollbar-width:none;}
  .tabs-inner::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:700;padding:9px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;transition:all .16s;}
  .tab:hover{color:var(--navy);background:rgba(31,58,95,.05);}
  .tab.active{background:var(--navy);color:var(--cream-soft);}

  main{max-width:920px;margin:0 auto;padding:26px 22px 80px;}
  section.panel{display:none;animation:fade .3s ease;}
  section.panel.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  h2.sec{font-family:'Noto Serif KR',serif;font-size:22px;color:var(--navy);font-weight:700;margin-bottom:6px;}
  .sec-desc{color:var(--muted);font-size:14px;margin-bottom:22px;}

  /* cards / boxes */
  .box{background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px;}
  .box h3{font-family:'Noto Serif KR',serif;font-size:17px;color:var(--navy);font-weight:700;margin-bottom:12px;}
  .box ul{list-style:none;display:flex;flex-direction:column;gap:9px;}
  .box li{display:flex;gap:10px;font-size:14px;line-height:1.6;}
  .box li::before{content:"•";color:var(--gold);font-weight:700;flex-shrink:0;}

  /* principle cards */
  .principles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:22px;}
  .pr{background:linear-gradient(165deg,var(--navy),var(--navy-deep));color:var(--cream-soft);border-radius:16px;padding:20px;}
  .pr .n{font-family:'Noto Serif KR',serif;color:var(--gold-soft);font-size:28px;font-weight:700;line-height:1;}
  .pr h4{font-size:15px;margin:10px 0 7px;color:#fff;}
  .pr p{font-size:13px;color:#c9d3df;line-height:1.55;}

  /* progress */
  .progress-card{background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:15px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
  .progress-card .label{font-weight:700;color:var(--navy);font-size:13.5px;white-space:nowrap;}
  .track{flex:1;min-width:140px;height:9px;background:var(--cream);border-radius:99px;overflow:hidden;}
  .fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),#d8b25e);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1);}
  .count{font-weight:700;color:var(--gold);font-size:13.5px;white-space:nowrap;}

  /* part filter chips */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;}
  .chip{border:1px solid var(--line);background:var(--white);color:var(--muted);padding:8px 15px;border-radius:99px;font-size:13px;font-weight:500;cursor:pointer;transition:all .16s;font-family:inherit;}
  .chip:hover{border-color:var(--gold);color:var(--navy);}
  .chip.active{background:var(--navy);color:var(--cream-soft);border-color:var(--navy);}

  /* part block */
  .part-head{display:flex;align-items:center;gap:12px;margin:30px 0 14px;}
  .part-head .ic{font-size:26px;}
  .part-head h3{font-family:'Noto Serif KR',serif;font-size:21px;color:var(--navy);font-weight:700;}

  .handover{background:var(--cream-soft);border:1px solid var(--gold-soft);border-radius:16px;padding:18px 20px;margin-bottom:18px;}
  .handover .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--gold);background:rgba(184,138,47,.12);padding:4px 12px;border-radius:7px;margin-bottom:14px;}
  .ho-intro{font-size:13.5px;line-height:1.72;color:#5a5240;background:rgba(184,138,47,.07);border-radius:11px;padding:14px 16px;margin-bottom:16px;border:1px solid rgba(184,138,47,.18);}
  .script-block{background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;}
  .script-block h4{font-family:'Noto Serif KR',serif;font-size:16px;color:var(--navy);font-weight:700;padding:16px 18px 0;}
  .script-block ul{list-style:none;display:flex;flex-direction:column;gap:8px;padding:12px 18px 18px;}
  .script-block li{display:flex;gap:9px;font-size:13.5px;line-height:1.6;}
  .script-block li::before{content:"–";color:var(--gold);font-weight:700;flex-shrink:0;}
  .stepnum{counter-reset:step;}
  .ho-group{margin-bottom:14px;}
  .ho-group:last-child{margin-bottom:0;}
  .ho-label{font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:7px;letter-spacing:.02em;}
  .ho-group ul{list-style:none;display:flex;flex-direction:column;gap:7px;}
  .ho-group li{display:flex;gap:9px;font-size:13.5px;line-height:1.58;color:var(--ink);}
  .ho-check li::before{content:"☑";color:var(--good);flex-shrink:0;}
  .ho-fix li::before{content:"→";color:var(--gold);font-weight:700;flex-shrink:0;}
  .ho-note{background:rgba(184,138,47,.07);border-radius:10px;padding:12px 14px;}
  .ho-note li{font-size:13px;color:#6b5d3f;}
  .ho-note li::before{content:"!";color:var(--gold);font-weight:700;flex-shrink:0;}

  .prac-label{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--navy);background:rgba(31,58,95,.07);padding:4px 12px;border-radius:7px;margin:6px 0 12px;}

  /* scenario card */
  .card{background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;border-left:4px solid var(--line);transition:border-color .25s;}
  .card.done{border-left-color:var(--good);}
  .card-head{padding:18px 20px 0;}
  .card h4{font-family:'Noto Serif KR',serif;font-weight:700;font-size:16px;color:var(--navy);line-height:1.4;}
  .situation{padding:14px 20px 4px;}
  .who{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.04em;margin-bottom:8px;display:flex;align-items:center;gap:7px;}
  .who .dot{width:22px;height:22px;border-radius:50%;background:var(--gold-soft);color:var(--navy);display:grid;place-items:center;font-size:11px;}
  .bubble{background:var(--cream);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:13px 17px;font-size:14.5px;color:var(--ink);position:relative;}
  .practice{padding:16px 20px 0;}
  .practice label{font-size:13px;font-weight:700;color:var(--navy);display:block;margin-bottom:8px;}
  textarea{width:100%;min-height:70px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-family:inherit;font-size:14px;color:var(--ink);background:var(--cream-soft);transition:border-color .16s;}
  textarea:focus{outline:none;border-color:var(--gold);background:var(--white);}
  .actions{padding:13px 20px 20px;display:flex;gap:9px;flex-wrap:wrap;align-items:center;}
  button.btn{font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;border-radius:10px;padding:10px 17px;border:1px solid var(--navy);background:var(--navy);color:var(--cream-soft);transition:all .16s;}
  button.btn:hover{background:var(--navy-deep);}
  button.btn.ghost{background:transparent;color:var(--navy);border-color:var(--line);}
  button.btn.ghost:hover{border-color:var(--gold);color:var(--gold);}
  .done-toggle{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;}
  .done-toggle input{width:18px;height:18px;accent-color:var(--good);cursor:pointer;}
  .answer{display:none;padding:0 20px 20px;}
  .answer.show{display:block;animation:fade .35s ease;}
  .answer-box{background:linear-gradient(165deg,var(--navy),var(--navy-deep));color:var(--cream-soft);border-radius:14px;padding:17px 19px;}
  .answer-box .ans-label{font-size:11px;letter-spacing:.16em;color:var(--gold-soft);font-weight:700;margin-bottom:11px;text-transform:uppercase;}
  .answer-box p{font-size:14.5px;line-height:1.72;margin-bottom:11px;}
  .answer-box p:last-child{margin-bottom:0;}
  .points{margin-top:14px;background:var(--cream-soft);border:1px solid var(--line);border-radius:12px;padding:15px 17px;}
  .points .p-label{font-size:11px;letter-spacing:.12em;color:var(--gold);font-weight:700;margin-bottom:10px;text-transform:uppercase;}
  .points ul{list-style:none;display:flex;flex-direction:column;gap:8px;}
  .points li{display:flex;gap:9px;font-size:13px;color:var(--ink);line-height:1.5;}
  .points li::before{content:"✓";color:var(--good);font-weight:700;flex-shrink:0;}

  /* template card */
  .tpl{background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden;}
  .tpl-head{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;}
  .tpl-head h4{font-size:15px;color:var(--navy);font-weight:700;}
  .tpl-head .when{font-size:11.5px;color:var(--muted);margin-top:3px;}
  .tpl-body{display:none;padding:0 18px 18px;}
  .tpl-body.show{display:block;}
  .tpl-text{background:var(--cream-soft);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:13.5px;line-height:1.7;color:var(--ink);white-space:pre-wrap;}
  .copy-btn{margin-top:10px;font-size:12px;font-weight:700;color:var(--gold);background:transparent;border:1px solid var(--gold-soft);border-radius:8px;padding:7px 14px;cursor:pointer;font-family:inherit;}
  .copy-btn:hover{background:rgba(184,138,47,.08);}
  .chev{color:var(--gold);font-size:13px;}

  /* tables */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.55;}
  table tr td:first-child{font-weight:700;color:var(--navy);white-space:nowrap;width:38%;}
  .atte-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
  .atte{background:var(--cream-soft);border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:13px;}
  .atte b{color:var(--navy);font-family:'Noto Serif KR',serif;}

  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:680px){.twocol{grid-template-columns:1fr;}}

  footer{text-align:center;padding:30px 22px 50px;color:var(--muted);font-size:12px;}
  footer .line{width:40px;height:2px;background:var(--gold-soft);margin:0 auto 14px;}

  @media(max-width:540px){
    header{padding:34px 18px 26px;}
    .actions{flex-direction:column;align-items:stretch;}
    .done-toggle{margin-left:0;justify-content:center;border-top:1px solid var(--line);padding-top:12px;}
    button.btn{width:100%;}
  }
</style>
</head>
<body>

<header>
  <div class="hw">
    <div class="eyebrow">Dream House · Manager Handbook</div>
    <h1>드림하우스 한국인 매니저 통합 핸드북</h1>
    <p class="lede">파트별 <b style="color:#fff">인수인계 안내</b>와 실제 어머님 응대 <b style="color:#fff">모범답안 연습</b>을 한 곳에. 처음 오신 분도 이 자료 하나로 드림하우스 업무를 다 파악할 수 있도록 정리했습니다.</p>
  </div>
</header>

<nav class="tabs">
  <div class="tabs-inner" id="tabs"></div>
</nav>

<main id="main"></main>

<footer>
  <div class="line"></div>
  Dream House 한국인 매니저 통합 핸드북 · 내용은 계속 업데이트됩니다
</footer>

<script>
/* ===========================================================
   드림하우스 한국인 매니저 통합 핸드북 - 데이터
   파트별 [인수인계 안내] + [응대 연습 모범답안(실제 톤)]
   =========================================================== */

const PARTS = [
  /* ---------------- 에어컨 ---------------- */
  {
    id: "aircon", name: "에어컨", icon: "❄️",
    handover: {
      intro: "세부는 일 년 내내 덥고 습해서, 에어컨은 어머님들이 가장 중요하게 여기고 또 가장 자주 문제가 생기는 항목입니다. 컴플레인 1순위라고 보시면 됩니다. 핵심은 '리모컨 설정을 헷갈리신 것'인지 '기기 고장'인지를 먼저 구분하는 것입니다. ⚠️ 에어컨은 일반 수리기사(제리)가 못 보고, 반드시 에어컨 전담 기사 가리(Gari)를 불러야 합니다.",
      check: [
        "각 집 에어컨 리모컨이 어떤 종류인지 미리 기억해두기 — 집마다 리모컨이 달라서 냉방 표시가 'cool' 글자, 얼음(❄) 모양 등 제각각입니다",
        "시원한지 직접 확인 — 리모컨 설정 문제인지 기기 고장인지 구분 (기본 세팅: 냉방 cool / 22도 / 팬 high)",
        "장시간 비워둔 집은 시간을 두고 가동 후 다시 확인 (오래 안 쓰면 처음엔 덜 시원함)",
        "물이 떨어지거나 냄새가 나는지, 작동 중 멋대로 꺼지는지 확인",
        "리모컨 건전지 잔량 — 부족 알림 시 즉시 교체",
      ],
      fix: [
        "① 가장 먼저 리모컨 세팅 확인 — 냉방('cool' 글자 또는 얼음 ❄ 모양)인지, 팬이 'high'인지, 온도 22도인지 ('fan'·선풍기 모양이면 찬바람이 아니라 바람만 나옵니다) → ② 장시간 미사용 집은 시간 두고 재확인 → ③ 그래도 안 되면 에어컨 기사 Gari 호출",
        "냄새: 필터·에어컨 스프레이로 청소 → 2~3일 후 재발하면 기사 방문 (세부 고온다습 특성상 응축수 냄새가 날 수 있음)",
        "반복 고장(꺼짐·물·온도): 테크니션이 보드·카파시터 점검·교체 → 그래도 안 되면 신품으로 교체",
        "건전지·리모컨은 오피스에서 무료 교체",
        "수리로 며칠 가동했을 경우, 전기세는 체크인 하루 전 아침 측정으로 대체해 어머님 부담을 덜어드림",
      ],
      note: [
        "⚠️ 에어컨은 반드시 에어컨 기사 Gari. 수리기사 제리(Jerry)는 에어컨을 못 봅니다.",
        "저녁 시간·토요일처럼 기사를 바로 부르기 어려운 때 '안 시원하다'고 하시면, 제일 먼저 리모컨 세팅(cool / 팬 high)부터 확인하도록 안내. 설정 문제로 해결되는 경우가 많습니다.",
        "에어컨은 가장 컴플레인이 잦은 항목. 반복되면 '괜찮다'고 넘기지 말고 교체까지 빠르게 결정하는 게 신뢰에 좋습니다.",
      ],
    },
    scenarios: [
      {
        cat: "에어컨",
        title: "(저녁·주말) 에어컨이 안 시원해요",
        mom: "방금 에어컨을 틀었는데 바람은 나오는데 시원하질 않아요. 지금 너무 더운데 어떡하죠? ㅠㅠ",
        answer: [
          "어머님 ㅠㅠ 더우신데 불편하시겠어요! 기사님 부르기 전에, 리모컨 설정부터 같이 한번 확인해볼게요~ 집마다 리모컨이 조금씩 달라서 설정 때문에 안 시원한 경우가 꽤 많거든요.",
          "리모컨에서 'cool' 글자나 눈송이(❄) 얼음 모양으로 되어 있는지 봐주시겠어요? 선풍기 모양이나 'fan'으로 되어 있으면 찬바람이 아니라 그냥 바람만 나와요! 그리고 온도는 22도 정도로 낮추시고, 바람 세기(팬)를 'high'로 올려주시면 한결 시원해질 거예요.",
          "이렇게 했는데도 계속 미지근하면 기기 문제일 수 있으니 바로 말씀 주세요! 제가 에어컨 기사 일정을 잡아 점검하도록 하겠습니다 😊",
        ],
        points: [
          "기기 고장으로 단정하기 전에 리모컨 세팅부터 함께 확인 (집마다 리모컨이 다름 — 미리 기억해두기).",
          "냉방 표시('cool' 글자 / ❄ 얼음 모양) 확인 + 22도 + 팬 'high'를 구체적으로 안내.",
          "그래도 안 되면 기사 점검으로 연결 (특히 저녁·토요일엔 이 안내로 해결되는 경우가 많음).",
        ],
      },
      {

];
let activeTab = "start";
let activePart = "전체";
const doneState = {};

const tabsEl = document.getElementById("tabs");
const mainEl = document.getElementById("main");

function buildTabs(){
  tabsEl.innerHTML = "";
  TABS.forEach(t=>{
    const b=document.createElement("button");
    b.className="tab"+(t.id===activeTab?" active":"");
    b.textContent=t.name;
    b.onclick=()=>{activeTab=t.id;render();window.scrollTo({top:0,behavior:"smooth"});};
    tabsEl.appendChild(b);
  });
}

function renderManual(){
  const cats = ["전체", ...PARTS.map(p=>p.name)];

  <p class="sec-desc">파트를 고르면 그 파트의 <b>인수인계 안내</b>(무엇을 점검하고 어떻게 조치하는지)와 <b>응대 연습</b>(실제 톤의 모범답안)이 함께 나옵니다.</p>

  // 진행도
  const total = PARTS.reduce((a,p)=>a+p.scenarios.length,0);
  const done = Object.values(doneState).filter(Boolean).length;
  html += `<div class="progress-card"><span class="label">응대 연습 진행도</span><div class="track"><div class="fill" style="width:${total?done/total*100:0}%"></div></div><span class="count">${done} / ${total} 완료</span></div>`;

  // 필터
  html += `<div class="filters">`;
  cats.forEach(c=>{ html += `<button class="chip${c===activePart?" active":""}" data-part="${c}">${c}</button>`; });
  html += `</div>`;

  // 파트 블록
  let idx = 0;
  PARTS.forEach(p=>{
    if(activePart!=="전체" && activePart!==p.name){ idx += p.scenarios.length; return; }
    html += `<div class="part-head"><span class="ic">${p.icon}</span><h3>${p.name}</h3></div>`;

    // 인수인계 안내
    html += `<div class="handover"><span class="tag">📋 인수인계 안내</span>`;
    if(p.handover.intro) html += `<p class="ho-intro">${p.handover.intro}</p>`;
    html += `<div class="ho-group"><div class="ho-label">무엇을 점검하나</div><ul class="ho-check">${p.handover.check.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
    html += `<div class="ho-group"><div class="ho-label">어떻게 조치하나</div><ul class="ho-fix">${p.handover.fix.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
    if(p.handover.note && p.handover.note.length){
      html += `<div class="ho-group"><div class="ho-label">담당 · 요금 · 주의</div><ul class="ho-note">${p.handover.note.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
    }
    html += `</div>`;

    // 응대 연습
    html += `<div class="prac-label">💬 응대 연습 (모범답안)</div>`;
    p.scenarios.forEach(s=>{
      const i = idx++;
      const isDone = !!doneState[i];
      html += `
      <div class="card${isDone?" done":""}" data-sid="${i}">
        <div class="card-head"><h4>${s.title}</h4></div>
        <div class="situation">
          <div class="who"><span class="dot">엄마</span> 어머님이 이렇게 말씀하십니다</div>
          <div class="bubble">${s.mom}</div>
        </div>
        <div class="practice">
          <label>어떻게 답하시겠어요?</label>
          <textarea placeholder="본인 말투로 답을 적어보세요..."></textarea>
        </div>
        <div class="actions">
          <button class="btn" data-act="show">모범답안 보기</button>
          <button class="btn ghost" data-act="reset">다시 쓰기</button>
          <label class="done-toggle"><input type="checkbox" ${isDone?"checked":""} data-act="done"> 완료</label>
        </div>
        <div class="answer">
          <div class="answer-box">
            <div class="ans-label">모범답안 · 상황에 맞게 필요한 부분만 인용</div>
            ${s.answer.map(par=>`<p>${par}</p>`).join("")}
          </div>
          <div class="points">
            <div class="p-label">핵심 포인트</div>
            <ul>${s.points.map(pt=>`<li>${pt}</li>`).join("")}</ul>
          </div>
        </div>
      </div>`;
    });
  });
  return html;
}

function render(){
  buildTabs();
  let content="";
  if(activeTab==="start") content=renderStart();
  else if(activeTab==="basic") content=renderBasic();
  else if(activeTab==="checkin") content=renderCheckin();
  else if(activeTab==="checkout") content=renderCheckout();
  else if(activeTab==="manual") content=renderManual();
  else if(activeTab==="tpl") content=renderTpl();
  else if(activeTab==="contact") content=renderContact();
  else if(activeTab==="cases") content=renderCases();
  else if(activeTab==="improve") content=renderImprove();
  mainEl.innerHTML = `<section class="panel active">${content}</section>`;
  attach();
}

function attach(){
  // 파트 필터
  mainEl.querySelectorAll("[data-part]").forEach(b=>{
    b.onclick=()=>{activePart=b.getAttribute("data-part");render();};
  });
  // 시나리오 카드
  mainEl.querySelectorAll(".card").forEach(card=>{
    const sid=card.getAttribute("data-sid");
    const ans=card.querySelector(".answer");
    const ta=card.querySelector("textarea");
    card.querySelector('[data-act="show"]').onclick=(e)=>{
      ans.classList.toggle("show");
      e.target.textContent=ans.classList.contains("show")?"답안 접기":"모범답안 보기";
    };
    card.querySelector('[data-act="reset"]').onclick=()=>{ta.value="";ta.focus();};
    card.querySelector('[data-act="done"]').onchange=(e)=>{
      doneState[sid]=e.target.checked;
      // 진행도/스타일만 갱신
      card.classList.toggle("done",e.target.checked);
      const total=PARTS.reduce((a,p)=>a+p.scenarios.length,0);
      const done=Object.values(doneState).filter(Boolean).length;
      const fill=mainEl.querySelector(".fill");const cnt=mainEl.querySelector(".count");
      if(fill)fill.style.width=(total?done/total*100:0)+"%";
      if(cnt)cnt.textContent=`${done} / ${total} 완료`;
    };
  });
  // 안내문 토글 + 복사
  mainEl.querySelectorAll("[data-tpl]").forEach(h=>{
    h.onclick=()=>{
      const body=h.nextElementSibling;
      body.classList.toggle("show");
      h.querySelector(".chev").textContent=body.classList.contains("show")?"접기 ▴":"펼치기 ▾";
    };
  });
  mainEl.querySelectorAll("[data-copy]").forEach(b=>{
    b.onclick=()=>{
      const i=b.getAttribute("data-copy");
      const text=TEMPLATES[i].body;
      navigator.clipboard?.writeText(text).then(()=>{
        const o=b.textContent;b.textContent="✅ 복사됨!";setTimeout(()=>b.textContent=o,1500);
      }).catch(()=>{b.textContent="길게 눌러 복사하세요";});
    };
  });
}

render();
</script>
</body>
</html>
