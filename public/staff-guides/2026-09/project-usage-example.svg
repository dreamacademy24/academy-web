<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><style>text{font-family:'Malgun Gothic',Arial,sans-serif;fill:#26344d}.small{font-size:17px;fill:#60708a}.label{font-size:20px;font-weight:700}.body{font-size:19px}.white{fill:#fff;font-size:19px;font-weight:700}</style><rect width="1200" height="780" fill="#f4f5fa"/><text x="40" y="47" font-size="26" font-weight="700">프로젝트 사용 예시</text><text x="40" y="78" class="small">설명을 위한 예시입니다. 실제 프로젝트 내용과 담당자는 다를 수 있습니다.</text><rect x="30" y="105" width="390" height="510" rx="15" fill="white" stroke="#dce2ee"/><rect x="440" y="105" width="730" height="510" rx="15" fill="white" stroke="#dce2ee"/>
